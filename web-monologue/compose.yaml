name: iyagi-monologue
services:
  web:
    image: iyagi-web-monologue:local
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      WEB_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-}
      MUD_HOST: ${MUD_HOST:-xmud.ddnsfree.com}
      MUD_PORT: ${MUD_PORT:-6666}
    volumes:
      - monologue-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  monologue-data:
